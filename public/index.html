<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dishes Homepage</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h3 id="form-header">Add New Dish</h3>
  <form id="add-dish-form" onsubmit="addDish(event)">
    <input type="text" name="id" placeholder="Dish ID" required />
    <input type="text" name="name" placeholder="Dish name" required />
    <input type="text" name="origin" placeholder="Origin" />
    <input type="text" name="cookingTime" placeholder="Cooking Time" />
    <input type="text" name="difficulty" placeholder="Difficulty" />
    <br>
    <textarea name="ingredients" placeholder="Ingredients (comma-separated)" required></textarea>
    <br>
    <textarea name="preparationSteps" placeholder="Steps (comma-separated)" required></textarea>
    <br>
    <button type="submit" id="form-submit">Add Dish</button>
    <input type="hidden" name="dishId" id="dish-id" />
  </form>
  <br></br>
  <button onClick="loadAll()">Show all dishes</button>
  <br></br>
  <input type="text" id="search-input" placeholder="Enter dish name" />
  <button onClick="loadByName()">Search By Name</button>
  <div id="dish-list"></div>
<script src="app.js"></script> 
</body>
</html>
